name: CI

# triggers pipeline when push is made to any branch (typical CI pipeline rule)
on: [push]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Task 2: SAST
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      # save report in json format
      run: bandit -ll -ii -r . -f json -o bandit-report.json

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      # execute this step no matter of previous status
      with:
        # how artifacts will be named when exported
        name: bandit-findings
        path: bandit-report.json

  # ------------------------------------------------------- Task 2: image scanning
  image_scan:
    # each new job runs in a new isolated environment
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -f Dockerfile -t mytestapp:latest .

    - name: Docker Scout Scan
      uses: docker/scout-action@v1.15.1
      with:
        dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
        command: quickview,cves
        image: local://mytestapp:latest
        only-severities: critical,high
        sarif-file: scout-report.sarif
        # exit code by default is true which means 0, add true to produce non success
        exit-code: true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-scout-findings
        path: scout-report.sarif

  # ---------------------------------------------------------------- Task 3: DAST
  dast_scan:
    name: Deploy PyGoat and Run ZAP Scan
    runs-on: ubuntu-latest
    # Run after the other scans, but do NOT get skipped when they fail.
    # With a plain `needs:` this job would be skipped because Bandit / Scout
    # are expected to fail (they find vulnerabilities). `!cancelled()` keeps
    # the ordering while still running if an upstream job failed.
    needs: [sast_scan, image_scan]
    if: ${{ !cancelled() }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Bonus: build and deploy PyGoat from OUR repository instead of pulling
    # pygoat/pygoat:latest from Docker Hub.
    - name: Build PyGoat image from this repository
      run: docker build -f Dockerfile -t pygoat-local:${{ github.sha }} .

    - name: Run PyGoat container
      run: |
        docker run -d --name pygoat -p 8000:8000 pygoat-local:${{ github.sha }} \
          sh -c "python manage.py migrate --noinput && \
                 gunicorn --bind 0.0.0.0:8000 --workers 4 --worker-class gthread \
                          --threads 4 --timeout 600 pygoat.wsgi"

    # Hint from the lab: make sure the app is fully started before scanning.
    - name: Wait until PyGoat is healthy
      run: |
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
          if [ "$code" = "200" ] || [ "$code" = "302" ]; then
            echo "PyGoat is up (HTTP $code) after $((i*2))s"; exit 0
          fi
          sleep 2
        done
        echo "PyGoat did not start in time"; docker logs pygoat; exit 1

    - name: ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.14.0
      with:
        target: 'http://localhost:8000'
        # -a: also run alpha passive rules, -j: use the AJAX spider as well
        cmd_options: '-a -j'
        # do not open GitHub issues; just produce reports
        allow_issue_writing: false
        # report findings without failing the job; the report is the deliverable
        fail_action: false
        artifact_name: zap-baseline-report

    - name: Container logs
      if: always()
      run: docker logs pygoat || true

    - name: Stop PyGoat
      if: always()
      run: docker rm -f pygoat || true
